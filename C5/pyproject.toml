[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handy-py"
version = "0.1.0"
description = "Everyday Python utilities: layered config, resilient retries, TTL caching, and rate limiting — zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peak-romance" }]
keywords = ["config", "retry", "cache", "rate-limit", "utilities", "tooling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Peak-romance/handy"
Repository = "https://github.com/Peak-romance/handy"
Issues = "https://github.com/Peak-romance/handy/issues"
Documentation = "https://github.com/Peak-romance/handy/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handy = ["py.typed"]
